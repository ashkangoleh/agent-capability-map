name: Validate capability map

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
      - pre_release
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal runtime
        run: python -m pip install -e .
      - name: Validate authoritative YAML graph and routing fixtures
        run: |
          python -m capability_map validate
          python scripts/evaluate_graph.py
          python scripts/evaluate_ai_ml_quality.py
          python scripts/report_coverage.py --summary
          python scripts/audit_data_engineering_skills.py --summary --strict
          python scripts/audit_all_skill_evidence.py --summary --strict
      - name: Test CLI, security and overlays
        run: python -m unittest discover -s tests -v

  cross-platform-cli:
    name: CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python router
        run: python -m pip install -e .
      - name: Test cross-platform Python CLI
        run: python -m unittest discover -s tests -p test_cross_platform_cli.py -v
      - name: Test Node.js CLI bridge
        env:
          CAPABILITY_MAP_PYTHON: python
        run: npm test

  standalone-release:
    name: Standalone bundle (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-x64
          - os: windows-2022
            slug: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build toolchain
        run: python -m pip install -e . pyinstaller==6.22.3
      - name: Build frozen binary and stable asset archive
        run: python scripts/build_standalone.py --output dist/standalone
      - name: Extract and run without external Python or Node.js on PATH
        run: python scripts/smoke_standalone.py --archive dist/standalone/capability-map-${{ matrix.slug }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: capability-map-${{ matrix.slug }}
          path: dist/standalone/capability-map-${{ matrix.slug }}.zip
          if-no-files-found: error
          retention-days: 14
