name: Validate capability map

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal runtime
        run: python -m pip install -e .
      - name: Validate legacy registry and new YAML graph
        run: |
          python scripts/validate_registry.py
          python -m capability_map validate
      - name: Test CLI, security and overlays
        run: python -m unittest discover -s tests -v
