name: Validate capability map

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install authoring-only YAML dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate coverage taxonomy
        run: python scripts/validate_taxonomy.py
      - name: Validate registry and skill metadata
        run: python scripts/validate_registry.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
