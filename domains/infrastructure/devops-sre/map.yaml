    skills: domains/infrastructure/devops-sre/gitops/skills.yaml
  - id: delivery
    description: "delivery"
    triggers:
      - "ci/cd"
      - "github actions"
      - "ci cd supply chain"
    status: active
    skills: domains/infrastructure/devops-sre/delivery/skills.yaml
  - id: metrics
    description: "metrics"
    triggers:
      - "prometheus"
      - "slo burn rate"
    status: active
    skills: domains/infrastructure/devops-sre/metrics/skills.yaml
  - id: telemetry
    description: "telemetry"
    triggers:
      - "opentelemetry"
      - "otel collector"
    status: active
    skills: domains/infrastructure/devops-sre/telemetry/skills.yaml
  - id: incident
    description: "incident"
    triggers:
      - "sre incident"
      - "incident postmortem"
