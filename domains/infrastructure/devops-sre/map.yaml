schema_version: 1
id: devops-sre
kind: map
children:
  - id: terraform
    description: "terraform"
    triggers:
      - "terraform"
      - "terraform state"
      - "terraform module"
    status: active
    skills: domains/infrastructure/devops-sre/terraform/skills.yaml
  - id: ansible
    description: "ansible"
    triggers:
      - "ansible"
      - "ansible playbook"
    status: active
