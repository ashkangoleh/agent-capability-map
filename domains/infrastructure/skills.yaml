schema_version: 1
id: infrastructure
kind: skill-registry
skills:
  - id: platform-operations
    path: .agents/skills/platform-operations/SKILL.md
    description: "Use for Kubernetes, Helm, deployment, networking and SRE changes; inspect runtime state, failure modes and rollback before mutation."
    triggers:
      - "kubernetes"
      - "helm"
      - "docker"
      - "devops"
      - "sre"
      - "deployment"
      - "observability"
      - "cloud architecture"
      - "aws"
      - "linux server"
      - "networking"
    excludes:
      - "marketing"
    status: active
  - id: kubernetes-rollout-safety
    path: .agents/skills/kubernetes-rollout-safety/SKILL.md
    description: "Assess and implement safe Kubernetes rolling upgrades and canary rollouts with capacity, health gates and rollback conditions."
    triggers:
      - "kubernetes rollout"
      - "kubernetes canary"
      - "kubernetes rolling update"
      - "deployment rollout safety"
      - "k8s rollout"
      - "helm rollback plan"
    excludes:
      - "helm chart design"
    status: active
