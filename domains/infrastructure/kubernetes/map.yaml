    skills: domains/infrastructure/kubernetes/security/skills.yaml
  - id: helm
    description: "helm"
    triggers:
      - "helm chart"
      - "helm chart validation"
      - "helm template"
      - "helm upgrade"
      - "helm"
    status: active
    skills: domains/infrastructure/kubernetes/helm/skills.yaml
  - id: rollout
    description: "rollout"
    triggers:
      - "kubernetes rollout"
      - "kubernetes canary"
      - "k8s rollout"
