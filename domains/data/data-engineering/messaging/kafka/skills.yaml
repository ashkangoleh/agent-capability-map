  - id: kafka-connect-cdc-design
    path: .agents/skills/kafka-connect-cdc-design/SKILL.md
    description: "Engineer Kafka Connect workers, source and sink connectors with CDC snapshots, offsets and reliable task recovery."
    triggers:
      - "kafka connect"
      - "kafka connector"
      - "kafka connect cdc"
      - "kafka connect tasks"
