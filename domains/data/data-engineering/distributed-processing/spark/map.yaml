schema_version: 1
id: spark
kind: map
children:
  - id: pyspark
    description: "PySpark project setup and DataFrame transformations"
    triggers:
      - "pyspark"
      - "اسپارک با پایتون"
      - "پای اسپارک"
      - "python spark"
      - "spark python"
    status: active
    skills: domains/data/data-engineering/distributed-processing/spark/pyspark/skills.yaml
  - id: spark-sql
    description: "Spark SQL query and execution-plan engineering"
    triggers:
      - "spark sql"
      - "spark query"
    status: active
    skills: domains/data/data-engineering/distributed-processing/spark/sql/skills.yaml
  - id: scala
    description: "Scala Spark application engineering"
    triggers:
      - "spark scala job"
      - "scala spark"
      - "spark scala"
    status: active
    skills: domains/data/data-engineering/distributed-processing/spark/scala/skills.yaml
  - id: spark-runtime
    description: "Spark runtime, cluster and performance operations"
    triggers:
      - "spark cluster"
      - "spark submit"
      - "spark executor"
      - "spark performance"
    status: active
    skills: domains/data/data-engineering/distributed-processing/spark/runtime/skills.yaml
  - id: declarative-pipelines
    description: "Apache Spark Declarative Pipelines and Databricks Lakeflow boundaries"
    triggers:
      - "spark declarative pipelines"
      - "apache spark declarative pipelines"
    status: active
    skills: domains/data/data-engineering/distributed-processing/spark/declarative-pipelines/skills.yaml
