schema_version: 1
id: catalogs
kind: map
children:
  - id: nessie
    description: "Project Nessie branches, tags, merges and Iceberg REST migration"
    triggers:
      - "nessie versioned catalog"
      - "project nessie"
      - "nessie branch merge"
      - "nessie iceberg rest"
    status: active
    skills: domains/data/data-engineering/lakehouse/catalogs/nessie/skills.yaml
  - id: gravitino
    description: "Apache Gravitino metalakes and federated Iceberg REST catalog operations"
    triggers:
      - "apache gravitino"
      - "gravitino metalake"
      - "gravitino federated catalog"
      - "gravitino iceberg rest"
    status: active
    skills: domains/data/data-engineering/lakehouse/catalogs/gravitino/skills.yaml
  - id: iceberg-rest
    description: "Vendor-neutral Apache Iceberg REST protocol, credentials, concurrency and cross-engine interoperability"
    triggers:
      - "iceberg rest catalog"
      - "iceberg rest catalog credential vending"
      - "iceberg catalog commit retry"
      - "iceberg rest endpoint discovery"
    excludes:
      - "polaris"
      - "lakekeeper"
      - "nessie"
      - "gravitino"
    status: active
    skills: domains/data/data-engineering/lakehouse/catalogs/iceberg-rest/skills.yaml
  - id: polaris
    description: "polaris"
    triggers:
      - "polaris"
      - "polaris iceberg catalog"
    status: active
    skills: domains/data/data-engineering/lakehouse/catalogs/polaris/skills.yaml
  - id: lakekeeper
    description: "lakekeeper"
    triggers:
      - "lakekeeper"
      - "lakekeeper iceberg catalog"
    status: active
    skills: domains/data/data-engineering/lakehouse/catalogs/lakekeeper/skills.yaml
