schema_version: 1
id: lakehouse
kind: map
children:
  - id: iceberg
    description: "Apache Iceberg format and maintenance"
    triggers:
      - "iceberg"
      - "iceberg compaction"
      - "iceberg schema evolution"
      - "iceberg snapshot"
    status: active
    skills: domains/data/data-engineering/lakehouse/iceberg/skills.yaml
  - id: delta-lake
    description: "Delta Lake change data and merges"
    triggers:
      - "delta lake"
      - "delta cdf"
      - "delta change data feed"
    status: active
    skills: domains/data/data-engineering/lakehouse/delta/skills.yaml
  - id: hudi
    description: "Apache Hudi upserts and table layout"
    triggers:
      - "hudi"
      - "apache hudi"
      - "hudi mor"
    status: active
    skills: domains/data/data-engineering/lakehouse/hudi/skills.yaml
  - id: catalogs
    description: "catalogs"
    triggers:
      - "polaris"
      - "lakekeeper"
      - "iceberg rest catalog"
    status: active
    map: domains/data/data-engineering/lakehouse/catalogs/map.yaml
  - id: object-storage
    description: "object storage"
    triggers:
      - "minio"
      - "minio object storage"
      - "s3 compatible storage"
    status: active
    skills: domains/data/data-engineering/lakehouse/object-storage/skills.yaml
