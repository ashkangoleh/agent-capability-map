schema_version: 1
id: research
kind: skill-registry
skills:
  - id: evidence-research
    path: .agents/skills/evidence-research/SKILL.md
    description: "Use to research or fact-check a question by comparing current primary sources, supporting claims and labeling uncertainty."
    triggers:
      - "research this"
      - "verify"
      - "fact check"
      - "evidence"
      - "official documentation"
    excludes:
      - "write technical documentation"
    status: active
  - id: technical-writing-docs
    path: .agents/skills/technical-writing-docs/SKILL.md
    description: "Use to author accurate RFC, ADR, runbook and technical documentation grounded in verified code and version-specific sources."
    triggers:
      - "write documentation"
      - "technical writing"
      - "adr"
      - "rfc"
      - "runbook"
    excludes:
      - "pure marketing copy"
    status: active
