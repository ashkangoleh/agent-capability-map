    skills: domains/business/operations-management/operating-kpi-scorecard/skills.yaml
  - id: continuity-response-drill
    description: "Record critical service dependencies, maximum tolerable downtime and minimum acceptable capacity"
    triggers:
      - "business operations continuity recovery drill recovery time capacity"
    status: active
    skills: domains/business/operations-management/continuity-response-drill/skills.yaml
