schema_version: 1
id: product
kind: skill-registry
skills:
  - id: product-discovery-prd
    path: .agents/skills/product-discovery-prd/SKILL.md
    description: "Use for product discovery and PRDs; define the user problem, research evidence, metrics, requirements and acceptance criteria."
    triggers:
      - "prd"
      - "سند نیازمندی محصول"
      - "product discovery"
      - "product requirements"
      - "roadmap"
      - "user stories"
      - "product strategy"
    excludes:
      - "marketing campaign"
    status: active
  - id: product-experiment-design
    path: .agents/skills/product-experiment-design/SKILL.md
    description: "Define rigorous randomized product experiments, primary outcomes, guardrails, instrumentation QA and causal analysis plans."
    triggers:
      - "a/b test"
      - "ab test"
      - "product experiment"
      - "experiment design"
      - "sample ratio mismatch"
      - "product experimentation"
    excludes:
      - "marketing campaign"
    status: active
  - id: product-metrics-instrumentation
    path: .agents/skills/product-metrics-instrumentation/SKILL.md
    description: "Define product activation, funnels, cohorts and retention metrics with explicit identity, denominator and event-quality contracts."
    triggers:
      - "product analytics"
      - "activation metric"
      - "product metrics"
      - "retention metrics"
      - "funnel instrumentation"
      - "north star metric"
    excludes:
      - "marketing attribution"
    status: active
